<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Raspadinha da Amizade</title></head><body><main><section class="hero"><div class="clover">🍀</div><h1>RASPADINHA<br><span style="color:#7cff00">DA AMIZADE</span></h1><p>Uma pequena surpresa pode estar esperando por você.</p></section><section class="glass" style="text-align:center"><canvas id="cv" width="700" height="360" style="width:100%;border-radius:18px;background:#ddd"></canvas><h2 id="res">RASPE AQUI</h2><button class="btn" id="raspar">🍀 RASPAR AGORA</button></section><section class="glass"><h2>🎁 Prêmios</h2><p>🍹 Liquidificador &nbsp; OU &nbsp; 🔥 Ferro elétrico</p></section></main><script>const c=document.getElementById("cv"),x=c.getContext("2d");function capa(){x.fillStyle="#bdbdbd";x.fillRect(0,0,c.width,c.height);x.fillStyle="#222";x.font="bold 54px Arial";x.textAlign="center";x.fillText("🍀 RASPE AQUI",350,200)}capa();let ativa=false;c.addEventListener("pointermove",e=>{if(!ativa)return;let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*c.width/r.width,py=(e.clientY-r.top)*c.height/r.height;x.globalCompositeOperation="destination-out";x.beginPath();x.arc(px,py,32,0,Math.PI*2);x.fill()});document.getElementById("raspar").onclick=()=>{ativa=true;document.getElementById("res").textContent=Math.random()<.5?"🎉 PARABÉNS! LIQUIDIFICADOR":"🎉 PARABÉNS! FERRO ELÉTRICO"};</script></body></html>
