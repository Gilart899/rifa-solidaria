<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Admin | Rifa</title></head><body><main><section class="glass"><h1>🔐 Painel da Rifa</h1><p>Controle dos números em tempo real.</p><div id="stats"></div><div id="lista"></div></section></main><script type="module">import {db} from "./firebase.js";import {ref,onValue} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";onValue(ref(db,"numeros"),s=>{let d=s.val()||{},v=Object.values(d);document.getElementById("stats").innerHTML=`Disponíveis: ${1000-v.length} | Reservados: ${v.filter(x=>x.status==="reservado").length} | Vendidos: ${v.filter(x=>x.status==="vendido").length}`;document.getElementById("lista").innerHTML=v.map(x=>`<p>${x.numero} — ${x.nome||""} — ${x.status}</p>`).join("")});</script></body></html>
