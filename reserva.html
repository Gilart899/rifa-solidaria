<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Reserva | Rifa Entre Amigos</title></head><body><main><section class="glass"><h1>✅ Confirmar participação</h1><div id="nums"></div><input id="nome" placeholder="Seu nome"><input id="fone" inputmode="tel" placeholder="WhatsApp"><button class="btn" id="confirmar">CONFIRMAR RESERVA</button><p id="msg"></p></section></main><script type="module">import {db} from "./firebase.js";import {ref,runTransaction} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";import {CONFIG} from "./config.js";let nums=JSON.parse(localStorage.getItem("rifaSelecionados")||"[]");document.getElementById("nums").textContent=nums.join(", ")+" • R$ "+(nums.length*CONFIG.valor).toFixed(2).replace(".",",");document.getElementById("confirmar").onclick=async()=>{let nome=document.getElementById("nome").value.trim(),fone=document.getElementById("fone").value.trim();if(!nome||!fone||!nums.length)return alert("Preencha nome e WhatsApp.");let ok=true;for(const n of nums){let r=ref(db,"numeros/"+n);let t=await runTransaction(r,v=>v?undefined:{numero:n,status:"reservado",nome,telefone:fone,pagamento:false,criadoEm:Date.now()});if(!t.committed)ok=false}document.getElementById("msg").textContent=ok?"Reserva realizada! Agora envie o comprovante pelo WhatsApp.":"Um ou mais números já foram ocupados.";if(ok)window.open("https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent("Olá! Reservei os números "+nums.join(", ")+" da Rifa Entre Amigos. Nome: "+nome)," _blank")}</script></body></html>
